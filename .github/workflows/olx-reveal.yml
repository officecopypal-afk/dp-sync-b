name: OLX reveal (Faza 2)
# Czysty fetch (bez przeglądarki). Throttle jest PER-IP (~5/IP) → rotacja proxy IP.
# Numer → leads_ingest_offer → auto-SMS.

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Ile ogłoszeń z kolejki"
        default: "50"
      cap_per_ip:
        description: "Reveali na jedno IP (limit OLX ~5-6, potem kara ~10min)"
        default: "5"
      concurrency:
        description: "Ile workerów równolegle (każdy na swoim IP)"
        default: "10"
      proxy_country:
        description: "Kraj proxy (pl/de/fr/...) — świeża pula IP"
        default: "pl"
      proxy_countries:
        description: "Lista krajów do rotacji, np pl,ua,ro,de,gb (pusta = pojedynczy)"
        default: ""
      random_fp:
        description: "1 = losowy x-fingerprint per reveal (test flagowania FP)"
        default: ""
  # GENTLE probe co ~2h: mały batch po rotujących krajach, seal 12h. Jak blokada OLX minie — wznowi sam.
  schedule:
    - cron: "23 */2 * * *"

concurrency:
  group: olx-reveal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: reveal
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          OLX_FP: ${{ secrets.OLX_FP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX: ${{ github.event.inputs.max || '50' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '10' }}
          CAP_PER_IP: ${{ github.event.inputs.cap_per_ip || '5' }}
          MAX_IP_TRIES: "4"
          IP_COOLDOWN_HOURS: "12"
          DEFER_MIN: "25"
          PROXY_COUNTRY: ${{ github.event.inputs.proxy_country || 'pl' }}
          PROXY_COUNTRIES: ${{ github.event.inputs.proxy_countries || 'pl,ua,ro,de,gb' }}
          RANDOM_FP: ${{ github.event.inputs.random_fp || '' }}
        run: node revealer.mjs
      - name: Slack alert on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          payload=$(printf '{"text":":red_circle: *Bot numerów — FAIL*\\n*%s* padł na cronie\\n<%s|Otwórz log w GitHub Actions>"}' "$WF" "$RUN_URL")
          curl -sS -X POST "$SUPABASE_URL/functions/v1/scraper-alert" -H "authorization: Bearer $SRK" -H 'content-type: application/json' -d "$payload" || true
