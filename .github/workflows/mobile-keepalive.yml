name: OLX MOBILE keep-alive
# Trzyma konta ŻYWE bez skanowania — tylko odświeża tokeny 2×/dobę (zero reveali, zero ryzyka limitu).
on:
  # Schedule usunięty — trigger robi Supabase pg_cron 2×/dobę przez workflow_dispatch (odporny na auto-wyłączanie GH Actions po 60 dniach)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper/olx-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: keep-alive tokenów
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
        run: node mobile_keepalive.mjs
