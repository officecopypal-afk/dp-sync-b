name: OLX refresh sesji (cron)
# Odświeża tokeny wszystkich sesji w DB co 20 min (token żyje ~1h) → konta się nie wylogowują.
# Niezależny od Maca i od runu reveala. Headless (samo odświeżenie nie wymaga headful). Zapisuje świeże tokeny do DB.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      accounts:
        description: "Konta oddzielone spacją (puste = wszystkie z DB)"
        default: ""
concurrency:
  group: olx-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx patchright install --with-deps chromium
      - name: refresh sesji
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCOUNTS: ${{ github.event.inputs.accounts }}
        run: |
          if ! printf '%s' "$ACCOUNTS" | grep -Eq '^[A-Za-z0-9_, -]*$'; then echo "niedozwolone znaki w accounts"; exit 1; fi
          # po walidacji bez cudzysłowu, żeby podzielić na argumenty
          node refresh_db_sessions.mjs $ACCOUNTS
