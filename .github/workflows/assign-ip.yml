name: OLX assign IP (poza runem)
# Przypisuje/odświeża IP kont przez proxy i zapisuje do DB. Odpalane RĘCZNIE kiedykolwiek — też w trakcie runu reveala.
# Brak concurrency group → nie koliduje z workflowem reveala. Nie używa przeglądarki (tylko undici), więc lekkie/szybkie.
on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "Konta oddzielone spacją, np. konto13 konto14 (puste = wszystkie z DB)"
        default: ""
permissions:
  contents: read
jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: assign IP
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCOUNTS: ${{ github.event.inputs.accounts }}
        run: |
          if ! printf '%s' "$ACCOUNTS" | grep -Eq '^[A-Za-z0-9_, -]*$'; then echo "niedozwolone znaki w accounts"; exit 1; fi
          # po walidacji bez cudzysłowu, żeby podzielić na argumenty
          node assign_ip.mjs $ACCOUNTS
