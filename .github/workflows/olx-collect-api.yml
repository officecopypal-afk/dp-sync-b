name: OLX collect API (Faza 1)
# Kolektor linków przez API JSON — bez przeglądarki, ~60× mniej transferu niż wersja browser.
# Filtruje prywatne (business=false), kategorie 14/15/18. Główny kolektor.

on:
  # Schedule usunięty — trigger robi Supabase pg_cron co 15 min przez workflow_dispatch (odporny na auto-wyłączanie GH Actions po 60 dniach)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Sufit stron API na job (stop po 2 str. bez nowych)"
        default: "20"
      no_proxy:
        description: "true = pomiń proxy (leci z IP runnera). DOMYŚLNIE true od 31.07.2026 — proxy IPRoyal padło 25.07 (fetch failed) i zatrzymało zbieranie na 6,5 dnia. Wrócić na 'false' po naprawie/odnowieniu IPRoyal."
        default: "true"

concurrency:
  group: olx-collect-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper/olx-collect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: collect (API)
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          NO_PROXY_MODE: ${{ github.event.inputs.no_proxy || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}
        run: node collector_api.mjs
      - name: Slack alert on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          payload=$(printf '{"text":":red_circle: *Bot numerów — FAIL*\\n*%s* padł na cronie\\n<%s|Otwórz log w GitHub Actions>"}' "$WF" "$RUN_URL")
          curl -sS -X POST "$SUPABASE_URL/functions/v1/scraper-alert" -H "authorization: Bearer $SRK" -H 'content-type: application/json' -d "$payload" || true
