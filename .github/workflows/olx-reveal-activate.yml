name: OLX reveal AKTYWACJA (ciągły)
# Jednorazowy ciągły przelot CAŁEJ bazy (pętla aż kolejka pusta i brak odroczonych).
# Ten sam concurrency group co zwykły cron → nie dublują się. Po skończeniu cron leci dalej na bieżąco.

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Batch (ofert na obieg)"
        default: "600"
      concurrency:
        description: "Ile workerów równolegle (sweet spot ~30; >30 pali IP bez zysku)"
        default: "30"

concurrency:
  group: olx-reveal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scraper/olx-reveal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: reveal (ciągły)
        env:
          IPROYAL_PROXY: ${{ secrets.IPROYAL_PROXY }}
          OLX_FP: ${{ secrets.OLX_FP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOOP_UNTIL_EMPTY: "1"
          RUN_BUDGET_MS: "20400000"
          MAX: ${{ github.event.inputs.max || '600' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '30' }}
          CAP_PER_IP: "6"
          MAX_IP_TRIES: "4"
          DEFER_MIN: "10"
          PROXY_COUNTRIES: "pl,ua,ro,de,gb,pt,bg"
        run: node revealer.mjs
      - name: Slack alert on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          payload=$(printf '{"text":":red_circle: *Bot numerów — FAIL*\\n*%s* padł\\n<%s|Otwórz log w GitHub Actions>"}' "$WF" "$RUN_URL")
          curl -sS -X POST "$SUPABASE_URL/functions/v1/scraper-alert" -H "authorization: Bearer $SRK" -H 'content-type: application/json' -d "$payload" || true
